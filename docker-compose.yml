services:
  # ====== OpenClaw Gateway (оркестратор) ======
  openclaw:
    container_name: openclaw
    image: openclaw/openclaw:latest
    ports:
      - "18789:18789"
    volumes:
      # Pipeline код — OpenClaw будет видеть его как workspace
      - .:/workspace/redesign-pipeline
      # OpenClaw конфиг (если есть локально)
      - ./openclaw.json:/openclaw.json:ro
      # Docker socket — чтобы exec мог запускать pipeline-worker
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - OPENCLAW_GATEWAY_PORT=18789
      # Пробросить ключи для sub-агентов
      - VLLM_KEY=${VLLM_KEY}
      - VLLM_BASE=${VLLM_BASE:-https://rixtrema.net/api/vllm/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VISION_BACKEND=${VISION_BACKEND:-gateway}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
    restart: unless-stopped

  # ====== Pipeline Worker (исполняет шаги) ======
  pipeline-worker:
    container_name: pipeline-worker
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Результаты сохраняются на host
      - ./outputs:/app/outputs
      - ./sites:/app/sites
    # Не запускается сам — ждёт команд от openclaw
    profiles:
      - worker
    command: ["tail", "-f", "/dev/null"]
