services:
  redesign:
    build: .
    image: redesign-pipeline:latest
    container_name: redesign-pipeline
    stdin_open: true
    tty: true
    volumes:
      - ./outputs:/app/outputs
      - ./sites:/app/sites
    environment:
      - VLLM_BASE=${VLLM_BASE:-https://rixtrema.net/api/vllm/v1}
      - VLLM_KEY=${VLLM_KEY:-}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - VISION_BACKEND=${VISION_BACKEND:-gateway}
      - GATEWAY_URL=${GATEWAY_URL:-http://host.docker.internal:18789}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    # Фоновый режим: контейнер висит и ждёт exec команд
    # Для разового запуска: docker compose run --rm redesign --full https://...
    command: ["tail", "-f", "/dev/null"]
